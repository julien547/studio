<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DOEMO Studio · Connexion</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <aside class="hero" aria-hidden="true">
    <svg class="plan" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-width="2"><path d="M40 40h200v90h120v130H40z"/><path d="M40 130h120M160 130v130M240 130v60M240 190h120"/><path d="M110 40v40M300 130v40" stroke-dasharray="4 5"/></svg>
        <div><h2>Vos plans, prêts à l'emploi.</h2></div>
    <div class="foot">Accès réservé à l'équipe interne DOEMO.</div>
  </aside>
  <main class="panel">
    <form class="card" id="f" autocomplete="on" novalidate>
      <div class="logo-box"><img class="logo" src="/logo-studio.png" alt="DOEMO Studio" width="1000" height="334"></div>
      <h1>Connexion</h1>
      <p class="sub">Utilisez votre identifiant DOEMO.</p>
      <div class="err" id="err" role="alert"></div>
      <div class="field"><label for="login">Identifiant</label><input id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
      <div class="field"><label for="pw">Mot de passe</label><div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Afficher le mot de passe">Afficher</button></div></div>
      <button class="btn" id="go" type="submit">Se connecter</button>
      <p class="note">Compte clients non autorisé sur cet espace.</p>
    </form>
  </main>
</div>
<script src="/login.js"></script>
</body>
</html>
