[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doemo-releves"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.135,<0.136", "uvicorn>=0.41,<0.42", "python-multipart>=0.0.22", "httpx>=0.28,<0.29", "pypdfium2>=5.6,<6", "pypdf==6.21.3", "pillow>=12.1", "numpy>=2.2,<2.3", "opencv-python-headless>=4.12,<4.13"]

[project.scripts]
doemo-releves = "doemo_releves.cli:main"
doemo-studio-user = "doemo_releves.auth:main"
doemo-studio-worker = "doemo_releves.queue:main"

[tool.setuptools.package-data]
doemo_releves = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
