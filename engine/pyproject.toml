[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doemo-studio-pdf"
version = "0.3.5"
description = "Vector PDF levels and Linux test batch generation for DOEMO Studio"
requires-python = ">=3.11"
dependencies = ["pikepdf==10.17.0", "pypdf==6.21.3", "fonttools==4.68.0", "zstandard==0.25.0", "skia-pathops==0.9.2"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
doemo-pdf = "doemo_pdf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
