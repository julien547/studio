; Merge into the EXISTING supervisor configuration of the private GPU image.
; Do not start another supervisor or worker if one already owns the GPU.
[program:doemo-inference]
command=/bin/bash /opt/doemo-inference-test/runpod/start-service.sh
directory=/opt/doemo-inference-test
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=2800
redirect_stderr=true
stdout_logfile=/tmp/doemo-inference-service.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
