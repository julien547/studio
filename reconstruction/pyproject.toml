[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doemo-reconstruction"
version = "0.3.5"
description = "Prototype de reconstruction architecturale avec validation humaine"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "pypdfium2==5.14.0", "Pillow==13.0.0", "pypdf==6.21.3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
service = ["fastapi==0.135.1", "pydantic==2.14.1", "httpx==0.28.1", "uvicorn==0.41.0", "cryptography==50.0.2"]

[project.scripts]
doemo-reconstruction = "doemo_reconstruction.cli:main"

[tool.setuptools.packages.find]
include = ["doemo_reconstruction*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
